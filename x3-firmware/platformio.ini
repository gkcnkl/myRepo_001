; Xteink X3 custom firmware — "Bugün" day planner + focus timer.
;
; Hardware layer: FreeInk SDK (MIT), NOT vendored in this repo.
; Clone it next to this file before building:
;   git clone https://github.com/Free-Ink/freeink-sdk.git freeink-sdk
;   git -C freeink-sdk checkout 5095ddddb301f92d40dcb884db8fb436446022ea

[env:x3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DFREEINK_DEVICE_X3=1
  ; E-book engine: PSRAM-less memory profile, smaller per-face advance cache.
  -DFREEINK_BOOK_SMALL=1
  -DFREEINK_FONT_ADVANCE_SLOTS=128
  -DFREEINK_FONT_GLYPH_SLOTS=48
  ; Small profile caps a page at 304 text runs; a justified 21 px page needs
  ; ~400 (tools/patch_sdk.py makes the cap a flag).
  -DFREEINK_BOOK_MAX_RUNS_PER_PAGE=448
  ; Route stb_truetype's malloc/free/assert to the reader (see the header).
  -include "$PROJECT_DIR/src/reader/stbtt_alloc.h"
build_unflags = -std=gnu++11

extra_scripts = pre:tools/patch_sdk.py

lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
  FreeInkBook=symlink://freeink-sdk/libs/book/FreeInkBook
  ricmoo/QRCode@0.0.1
  adafruit/Adafruit GFX Library@1.12.1
